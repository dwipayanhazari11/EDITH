services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: edith_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - WEBHOOK_URL=${WEBHOOK_URL}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
      - ./code-nodes:/home/node/code-nodes:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: edith_cloudflared
    restart: unless-stopped
    # For named tunnel using Cloudflare Zero Trust:
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # For quick ad-hoc tunnel without a token, use:
    # command: tunnel --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
